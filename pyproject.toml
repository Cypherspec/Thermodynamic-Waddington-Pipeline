[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thermodynamic-waddington"
version = "0.2.0"
description = "Non-equilibrium thermodynamics of single-cell fate: path-work free-energy landscapes, entropy production, and irreversibility from RNA velocity"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Nischay Kommisetty", email = "nischay.kommisetty@gmail.com"}]
maintainers = [{name = "Nischay Kommisetty", email = "nischay.kommisetty@gmail.com"}]
keywords = [
    "single-cell",
    "RNA-velocity",
    "waddington",
    "free-energy",
    "entropy-production",
    "non-equilibrium",
    "thermodynamics",
    "cell-fate",
    "scRNA-seq",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.23"]

[project.urls]
Homepage = "https://github.com/Cypherspec/thermodynamic-waddington-pipeline"
Repository = "https://github.com/Cypherspec/thermodynamic-waddington-pipeline"
Issues = "https://github.com/Cypherspec/thermodynamic-waddington-pipeline/issues"

[project.optional-dependencies]
real-data = ["anndata>=0.10", "h5py>=3.10", "scvelo>=0.3", "scanpy>=1.9"]
viz = ["matplotlib>=3.7", "plotly>=5.18", "pandas>=2.0"]
fast = ["scipy>=1.10", "scikit-learn>=1.3"]
dev = ["pytest>=7.4", "build>=1.0", "twine>=4.0"]
all = [
    "anndata>=0.10", "h5py>=3.10", "scvelo>=0.3", "scanpy>=1.9",
    "matplotlib>=3.7", "plotly>=5.18", "pandas>=2.0",
    "scipy>=1.10", "scikit-learn>=1.3",
]

[project.scripts]
twaddington = "thermodynamic_waddington.cli:main"
tw-real = "thermodynamic_waddington.real_data_cli:main"
tw-experiment = "thermodynamic_waddington.experiment_cli:main"
tw-benchmark = "thermodynamic_waddington.benchmark_cli:main"
tw-visualize = "thermodynamic_waddington.visualize_cli:main"
tw-discover = "thermodynamic_waddington.discovery_cli:main"
tw-causal = "thermodynamic_waddington.causal_validation_cli:main"
tw-submit = "thermodynamic_waddington.submission_cli:main"
tw-reproduce = "thermodynamic_waddington.reproduce_cli:main"
tw-evidence-audit = "thermodynamic_waddington.evidence_audit_cli:main"
tw-premium = "thermodynamic_waddington.premium_cli:main"

[tool.setuptools.packages.find]
include = ["thermodynamic_waddington*"]

[tool.setuptools.package-data]
thermodynamic_waddington = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
