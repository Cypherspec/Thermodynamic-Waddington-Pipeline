[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermodynamic-waddington"
version = "0.1.0"
description = "Effective path-work free-energy landscapes from single-cell RNA velocity"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
twaddington = "thermodynamic_waddington.cli:main"
tw-real = "thermodynamic_waddington.real_data_cli:main"
tw-experiment = "thermodynamic_waddington.experiment_cli:main"
tw-benchmark = "thermodynamic_waddington.benchmark_cli:main"
tw-visualize = "thermodynamic_waddington.visualize_cli:main"
tw-discover = "thermodynamic_waddington.discovery_cli:main"
tw-causal = "thermodynamic_waddington.causal_validation_cli:main"
tw-submit = "thermodynamic_waddington.submission_cli:main"
tw-reproduce = "thermodynamic_waddington.reproduce_cli:main"
tw-evidence-audit = "thermodynamic_waddington.evidence_audit_cli:main"
tw-premium = "thermodynamic_waddington.premium_cli:main"

[project.optional-dependencies]
real-data = ["anndata>=0.10", "h5py>=3.10"]

[tool.setuptools.packages.find]
include = ["thermodynamic_waddington*"]
